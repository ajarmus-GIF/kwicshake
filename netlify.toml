# Netlify build configuration.
#
# The site builds as a static export (see next.config.ts): `npm run build` writes plain HTML,
# JS and assets to /out, and that folder is what gets published. No Next.js runtime plugin is
# needed — there is no server code to turn into functions.
#
# Kept while kwicshake.com still points at Netlify; Cloudflare's equivalents are wrangler.jsonc
# and public/_headers.
[build]
  command = "npm run build"
  publish = "out"

# Static media gets a real cache lifetime. Netlify's default for files served out of the publish
# directory is `max-age=0, must-revalidate`, which costs a conditional request per asset per
# visit — cheap in bytes (a 304), not free in round trips, and the cover clip is the one asset
# where a needless round trip is felt.
#
# A week rather than a year with `immutable`, because these paths are stable names, not
# content-hashed ones: replacing revolt-home.mp4 with a new cut keeps the same URL. `stale-while-
# revalidate` means the day after expiry is still served instantly while the refresh happens
# behind it. Next's own /_next/static/* is content-hashed and already immutable for a year;
# nothing here touches that.
[[headers]]
  for = "/video/*"
  [headers.values]
    Cache-Control = "public, max-age=604800, stale-while-revalidate=86400"

[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=604800, stale-while-revalidate=86400"
