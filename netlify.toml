# Netlify build configuration.
#
# This is a Next.js 15 App Router app, NOT a static-site generator, so `publish` is ".next"
# and never "dist" or "out" — Next writes neither. The Netlify Next.js runtime reads the
# .next build output and wires up routing itself; pointing publish at a plain folder would
# deploy an empty site.
#
# Declaring the config here rather than answering `netlify init`'s prompts means the build
# settings live in the repo and survive re-linking, a new site, or a different machine.
[build]
  command = "npm run build"
  publish = ".next"

# Netlify installs this automatically from the manifest — it does not need to be in
# package.json. It is what turns Next's server output into Netlify functions.
[[plugins]]
  package = "@netlify/plugin-nextjs"

# Static media gets a real cache lifetime. Netlify's default for files served out of the publish
# directory is `max-age=0, must-revalidate`, which costs a conditional request per asset per
# visit — cheap in bytes (a 304), not free in round trips, and the cover clip is the one asset
# where a needless round trip is felt.
#
# A week rather than a year with `immutable`, because these paths are stable names, not
# content-hashed ones: replacing revolt-home.mp4 with a new cut keeps the same URL. `stale-while-
# revalidate` means the day after expiry is still served instantly while the refresh happens
# behind it. Next's own /_next/static/* is content-hashed and already immutable for a year;
# nothing here touches that.
[[headers]]
  for = "/video/*"
  [headers.values]
    Cache-Control = "public, max-age=604800, stale-while-revalidate=86400"

[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=604800, stale-while-revalidate=86400"
